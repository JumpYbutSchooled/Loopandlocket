<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loop &amp; Locket</title>
  <meta name="description" content="Handmade crochet, lockets, and little gifts from Loop & Locket.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 88C16 66 14 36 34 32c8-1 14 4 16 10 2-6 8-11 16-10 20 4 18 34-16 56z' fill='%23f49bbb'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-main">
      <a class="logo" href="#/" aria-label="Loop & Locket home">
        <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 88C16 66 14 36 34 32c8-1 14 4 16 10 2-6 8-11 16-10 20 4 18 34-16 56z"/><circle cx="50" cy="22" r="7"/></svg>
        <span>Loop <em>&amp;</em> Locket</span>
      </a>

      <form class="search" id="search" role="search">
        <input type="search" name="q" placeholder="Search handmade goodies…" aria-label="Search products" autocomplete="off">
        <button type="submit" aria-label="Search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </button>
      </form>

      <a class="header-link" href="#/account">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
        <span id="account-label">Sign in</span>
      </a>
    </div>
    <nav class="subnav" id="subnav" aria-label="Categories"></nav>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div>
        <p class="footer-logo">Loop &amp; Locket</p>
        <p>Handmade crochet, lockets, and little gifts, made with love one stitch at a time.</p>
      </div>
      <div>
        <p class="footer-head">Questions?</p>
        <p><a href="mailto:loopandlocket@gmail.com">loopandlocket@gmail.com</a></p>
      </div>
      <div>
        <p class="footer-head">Secure checkout</p>
        <p>Payments are processed by Stripe. We never see your card details.</p>
      </div>
    </div>
    <p class="footer-fine">© <span id="year"></span> Loop &amp; Locket</p>
  </footer>


  <script type="module" src="js/app.js"></script>
</body>
</html>
